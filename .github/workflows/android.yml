name: ST Checker PyTorch APK Auto Packager
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Buildozer Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake python3-dev build-essential gcc g++ ccache libffi-dev

      - name: Install Pure Build Tools
        run: |
          python3 -m pip install --upgrade pip
          pip install Cython==0.29.33 buildozer

      - name: Build with Buildozer (PyTorch Embedding Mode)
        run: |
          # (핵심) 예스맨 라이선스 자동 동의 옵션 장착
          buildozer --accept-sdk-license android debug
        continue-on-error: false

      - name: Upload Finished PyTorch APK
        uses: actions/upload-artifact@v4
        with:
          name: ST_Checker_Real_PyTorch_APK
          path: bin/*.apk
