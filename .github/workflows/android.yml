name: ST Checker PyTorch APK Auto Packager
on: [push, workflow_dispatch]

name: ST Checker APK Auto Packager
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake python3-dev build-essential gcc g++ ccache libffi-dev
          pip install --user Cython==0.29.33 buildozer

      - name: Build with Buildozer (PATH Fix)
        run: |
          # [핵심] 빌도저가 설치된 로컬 경로(~/.local/bin)를 PATH에 추가
          export PATH=$PATH:$HOME/.local/bin
          buildozer --version
          buildozer -v android debug
        # ...나머지 steps (upload-artifact) 동일

      - name: Upload Finished PyTorch APK
        uses: actions/upload-artifact@v4
        with:
          name: ST_Checker_Real_PyTorch_APK
          path: bin/*.apk
