name: ST Checker APK Auto Packager
on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies & Aidl/Sdk Fixer
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake python3-dev build-essential gcc g++ ccache libffi-dev libstdc++6 aidl

      - name: Install Buildozer Tool
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install Cython==0.29.33 buildozer --break-system-packages

      - name: Build with Buildozer (Sdkmanager Location Locked)
        env:
          ANDROID_STOREPASS: '"android"'
          ANDROID_KEYPASS: '"android"'
          APP_ANDROID_ACCEPT_SDK_LICENSE: 1
        run: |
          cd ${{ github.workspace }}
          export PATH=$PATH:$HOME/.local/bin
          
          # [해결책 핵심 1] 빌도저가 먼저 기본 SDK 베이스 방을 구축하도록 강제 유도
          buildozer android status || true
          
          # [해결책 핵심 2] 구글의 이사 간 최신 커맨드라인 툴들을 수동으로 다운로드하여 구버전 tools/bin 방 모양으로 똑같이 조각해 줍니다.
          mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
          cd ~/.buildozer/android/platform/android-sdk
          wget https://google.com -O cmdline.zip
          unzip -q cmdline.zip && rm cmdline.zip
          
          # 새 방에 있던 sdkmanager 부품들을 빌도저가 쳐다보는 tools/bin 방으로 강제 복사 배송합니다.
          cp -r cmdline-tools/* tools/ 2>/dev/null || true
          cp cmdline-tools/bin/* tools/bin/ 2>/dev/null || true
          
          # 안드로이드 정품 인증 라이선스 계약 도장 찍기
          mkdir -p tools/licenses
          echo -e "\n24333f1a69b12ffb2a3d6e60af354557b736de2a" > tools/licenses/android-sdk-license
          
          # 원래 프로젝트 방으로 복귀 후 대국 최종 빌드 가동!
          cd ${{ github.workspace }}
          buildozer -v android debug
        continue-on-error: false

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: ST_Checker_Master_APK
          path: bin/*.apk
