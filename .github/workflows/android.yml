name: Build 『ST체커』 Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    # 1. 저장소 코드 가져오기
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. 파이썬 환경 설정
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. 우분투 필수 시스템 패키지 설치
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev libsqlite3-dev tk-dev uuid-dev lzma-dev liblzma-dev

    # 4. [핵심] Buildozer 및 안드로이드 SDK 캐시 불러오기 / 저장하기
    - name: Cache Buildozer and Android SDK 데이터 캐시 로드
      uses: actions/cache@v4
      with:
        # 캐싱할 타겟 폴더 지정 (.buildozer 폴더와 안드로이드 SDK/NDK 저장소)
        path: |
          ~/.buildozer
          .buildozer
        # 캐시 식별용 고유 키 값 생성 (buildozer.spec 설정이 바뀔 때만 캐시를 초기화)
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
        # 맞는 키가 없을 때 가장 최근의 캐시를 찾아서 매칭
        restore-keys: |
          ${{ runner.os }}-buildozer-

    # 5. 패키징 도구 설치
    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip==23.0.1
        pip install buildozer cython==0.29.36 virtualenv

    # 6. APK 빌드 실행 (캐시가 있으면 이미 다운로드된 SDK를 사용하여 초고속 빌드)
    - name: Build with Buildozer
      run: |
        yes | buildozer android debug

    # 7. 완성된 APK 파일 내보내기
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ST-Checker-Game-APK
        path: bin/*.apk
