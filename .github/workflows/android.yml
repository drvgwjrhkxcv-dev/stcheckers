name: ST Checker APK Auto Packager
on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04 # 도커 가상선 없이 순수 리눅스 서버에서 직접 구동
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (Safe Fix Mode)
        # apt update 실패 시 무시하고 진행하도록 || true 쉴드를 치고,
        # 최신 안드로이드 컴파일 필수 64비트 호환 부품과 aidl을 수동 선출시합니다.
        run: |
          sudo apt-get update --fix-missing || true
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake python3-dev build-essential gcc g++ ccache libffi-dev libstdc++6 aidl

      - name: Install Buildozer Tool
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install Cython==0.29.33 buildozer --break-system-packages

      - name: Build with Buildozer (Pure Absolute Mode)
        env:
          ANDROID_STOREPASS: '"android"'
          ANDROID_KEYPASS: '"android"'
          APP_ANDROID_ACCEPT_SDK_LICENSE: 1
        run: |
          # 1. 파일들이 모여 있는 진짜 절대 경로 방으로 직통 로그인
          cd ${{ github.workspace }}
          
          # 2. 숨겨진 빌도저 실행 파일 경로를 강제로 시스템 PATH에 주입
          export PATH=$PATH:$HOME/.local/bin
          
          # 3. [sdkmanager 이새끼 버그 원천 진압] 구글 공식 최신 커맨드라인 툴팩을 강제로 직전 이식합니다.
          mkdir -p $HOME/.buildozer/android/platform/android-sdk/cmdline-tools
          cd $HOME/.buildozer/android/platform/android-sdk/cmdline-tools
          wget -q https://google.com -O cmdline.zip
          unzip -q cmdline.zip && mv cmdline-tools latest && rm cmdline.zip
          
          # 4. 안드로이드 정품 인증 라이선스 계약서 도장 미리 각인
          mkdir -p $HOME/.buildozer/android/platform/android-sdk/licenses
          echo -e "\n24333f1a69b12ffb2a3d6e60af354557b736de2a" > $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license
          
          # 5. 원래 프로젝트 방으로 안전 복귀 후 대국 최종 빌드 가동!
          cd ${{ github.workspace }}
          buildozer -v android debug
        continue-on-error: false

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: ST_Checker_Master_APK
          path: bin/*.apk
