name: ST Checker APK Auto Packager
on: [push, workflow_dispatch] # 내가 코드를 올리거나 버튼을 누르면 자동 실행

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Buildozer Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake python3-dev build-essential gcc g++ ccache libffi-dev

      - name: Install Buildozer & Core Packages
        run: |
          pip install --upgrade pip
          pip install buildozer kivy numpy

      - name: Build with Buildozer
        run: |
          # 내 디렉토리에 .buildozer 안 만들고 임시 공간에서만 빌드하도록 세팅
          buildozer -v android debug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: ST_Checker_Game_APK
          path: bin/*.apk
