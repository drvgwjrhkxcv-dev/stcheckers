name: ST Checker APK Auto Packager
on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update --fix-missing || true
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake python3-dev build-essential gcc g++ ccache libffi-dev libstdc++6 aidl

      - name: Install Buildozer Tool
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install Cython==0.29.33 buildozer --break-system-packages

      - name: Build with Buildozer (FORCED OFFLINE FREEZE MODE)
        env:
          ANDROID_STOREPASS: '"android"'
          ANDROID_KEYPASS: '"android"'
          APP_ANDROID_ACCEPT_SDK_LICENSE: 1
        run: |
          cd ${{ github.workspace }}
          export PATH=$PATH:$HOME/.local/bin
          
          # [sdkmanager 원천 박살 핵심 치트키]
          # 빌도저에게 "이미 안드로이드 SDK 조립 다 끝났으니까 구글 매니저 쳐다보지도 말고,
          # 오직 현재 파일들만 가지고 바로 APK 상자 지퍼나 채워!"라고 오프라인 락(--offline)을 걸고 강제 컴파일을 선언합니다!
          buildozer --offline -v android debug || buildozer -v android debug
        continue-on-error: false

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: ST_Checker_Master_APK
          path: bin/*.apk
