name: ST Checker APK Auto Packager
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Buildozer Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake python3-dev build-essential gcc g++ ccache libffi-dev

      - name: Install Buildozer & Core Packages
        run: |
          pip install --upgrade pip
          pip install buildozer bidi kivy numpy

      - name: Build with Buildozer (Auto Accept Mode)
        run: |
          export BUILDOZER_HOME=/tmp/buildozer_cache
          # (핵심) 예스맨 명령어(yes)를 앞에 붙여서 모든 안드로이드 라이선스 경고를 강제 패스시킵니다.
          yes | buildozer -v android debug
        continue-on-error: false

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: ST_Checker_Game_APK
          path: bin/*.apk
