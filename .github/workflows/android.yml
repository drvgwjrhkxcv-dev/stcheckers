name: ST Checker PyTorch APK Auto Packager
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Buildozer Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake python3-dev build-essential gcc g++ ccache libffi-dev

      - name: Install Pure Build Tools
        run: |
          python3 -m pip install --upgrade pip
          pip install Cython==0.29.33 buildozer

      - name: Build with Buildozer (Pure Default Home Mode)
        env:
          ANDROID_STOREPASS: '"android"'
          ANDROID_KEYPASS: '"android"'
          # 안드로이드 SDK 라이선스는 질문 없이 자동 통과하도록 환경 변수 유지
          APP_ANDROID_ACCEPT_SDK_LICENSE: 1
        run: |
          # [유저 요청 반영] export BUILDOZER_HOME 삭제! 
          # 이제 깃허브 서버의 기본 시스템 경로에서 정석대로 빌드가 진행됩니다.
          buildozer -v android debug
        continue-on-error: false

      - name: Upload Finished PyTorch APK
        uses: actions/upload-artifact@v4
        with:
          name: ST_Checker_Real_PyTorch_APK
          path: bin/*.apk
