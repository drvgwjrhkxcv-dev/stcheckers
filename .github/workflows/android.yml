name: ST Checker APK Auto Packager
on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          # 리눅스 시스템 단에 aidl과 필수 호환성 64비트 라이브러리들을 튼튼하게 주입합니다.
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake python3-dev build-essential gcc g++ ccache libffi-dev libstdc++6 aidl

      - name: Install Buildozer Tool
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install Cython==0.29.33 buildozer --break-system-packages

      - name: Patch Buildozer Sdkmanager Path Bug
        run: |
          # 빌도저가 최신 주소록(cmdline-tools)을 바라보게 만드는 눈알 교정 수술
          sed -r "s/'tools', 'bin'/'cmdline-tools', 'latest', 'bin'/" -i /usr/local/lib/python3.10/dist-packages/buildozer/targets/android.py || true
          sed -r "s/'tools', 'bin'/'cmdline-tools', 'latest', 'bin'/" -i $HOME/.local/bin/buildozer || true

      - name: Build with Buildozer (Absolute License Lock Free)
        env:
          ANDROID_STOREPASS: '"android"'
          ANDROID_KEYPASS: '"android"'
          APP_ANDROID_ACCEPT_SDK_LICENSE: 1
        run: |
          cd ${{ github.workspace }}
          export PATH=$PATH:$HOME/.local/bin
          
          # [Aidl 차단 해결 핵심] 빌도저가 다운로드를 시작하기 전에, 구글의 모든 정품 인증 라이선스 폴더와 
          # 자동 동의 암호 확인 도장 파일들을 물리적으로 미리 생성해서 박아버립니다!
          mkdir -p $HOME/.buildozer/android/platform/android-sdk/licenses
          echo -e "\n24333f1a69b12ffb2a3d6e60af354557b736de2a" > $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license
          echo -e "\nd56f5187479451eabf01fb74314b50d2e2d4b6ec" > $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-sys-img-license
          
          # 이제 라이선스 제약이 풀린 빌도저가 안드로이드 도구들을 프리패스로 직통 다운로드합니다!
          buildozer -v android debug
        continue-on-error: false

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: ST_Checker_Master_APK
          path: bin/*.apk
