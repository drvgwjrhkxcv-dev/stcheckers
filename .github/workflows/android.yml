name: ST Checker APK Auto Packager
on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Android SDK (Github Official Tool)
        uses: android-actions/setup-android@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update --fix-missing || true
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake python3-dev build-essential gcc g++ ccache libffi-dev libstdc++6 aidl

      - name: Install Buildozer Tool
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install Cython==0.29.33 buildozer --break-system-packages

      - name: Forced Buildozer Home Creation & SDK Sync (The Ultimate Fix)
        run: |
          # 👑 [유저 분석 기반 핵심 대수술] 
          # 빌도저가 게으름 피우며 안 만든 마스터 기지 폴더(.buildozer)와 안드로이드 플랫폼 방을 물리적으로 강제 생성합니다!
          mkdir -p $HOME/.buildozer/android/platform/android-sdk
          
          # 깃허브 시스템에 이미 완벽하게 설치되어 있는 정품 안드로이드 SDK 내용물을
          # 방금 강제로 만든 빌도저의 비밀 기지 방 안으로 통째로 복사해서 통로를 직통 용접해 버립니다!
          cp -r $ANDROID_HOME/* $HOME/.buildozer/android/platform/android-sdk/ 2>/dev/null || true
          
          # 빌도저가 원하는 구형 tools/bin 방 모양이 없을 것을 대비해, 최신 cmdline-tools의 sdkmanager를 tools 방으로 복사 연결해 둡니다.
          mkdir -p $HOME/.buildozer/android/platform/android-sdk/tools/bin
          cp -r $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/* $HOME/.buildozer/android/platform/android-sdk/tools/bin/ 2>/dev/null || true
          
          # 이제 눈앞에 .buildozer 폴더와 정품 파일들이 물리적으로 100% 꽉 차 있는 것을 로봇에게 증명합니다.
          ls -la $HOME/.buildozer/android/platform/android-sdk/tools/bin/

      - name: Build with Buildozer (Forced Infrastructure Mode)
        env:
          ANDROID_STOREPASS: '"android"'
          ANDROID_KEYPASS: '"android"'
          APP_ANDROID_ACCEPT_SDK_LICENSE: 1
        run: |
          cd ${{ github.workspace }}
          export PATH=$PATH:$HOME/.local/bin
          
          # 마스터 집(.buildozer)이 강제로 완공되었으므로, 빌도저가 입도 뻥긋 못 하고 즉시 최종 안드로이드 포장을 시작합니다!
          buildozer -v android debug
        continue-on-error: false

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: ST_Checker_Master_APK
          path: bin/*.apk
