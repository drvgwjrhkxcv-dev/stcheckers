name: ST Checker APK Auto Packager
on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake python3-dev build-essential gcc g++ ccache libffi-dev libstdc++6 aidl

      - name: Install Buildozer Tool
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install Cython==0.29.33 buildozer --break-system-packages

      - name: Patch Buildozer Sdkmanager Path Bug
        run: |
          # [버그 박살 핵심] 빌도저 본체 내부의 안드로이드 소스코드(android.py)를 추적하여,
          # 옛날 주소인 'tools', 'bin'을 최신 주소인 'cmdline-tools', 'latest', 'bin'으로 강제 치환 수선합니다!
          sed -r "s/'tools', 'bin'/'cmdline-tools', 'latest', 'bin'/" -i /usr/local/lib/python3.10/dist-packages/buildozer/targets/android.py || true
          sed -r "s/'tools', 'bin'/'cmdline-tools', 'latest', 'bin'/" -i $HOME/.local/lib/python*/site-packages/buildozer/targets/android.py || true

      - name: Build with Buildozer (Perfect Auto Mode)
        env:
          ANDROID_STOREPASS: '"android"'
          ANDROID_KEYPASS: '"android"'
          APP_ANDROID_ACCEPT_SDK_LICENSE: 1
        run: |
          cd ${{ github.workspace }}
          export PATH=$PATH:$HOME/.local/bin
          
          # 이제 눈이 멀었던 빌도저가 최신 안드로이드 SDK 주소를 한 번에 알아채고 질주합니다.
          buildozer -v android debug
        continue-on-error: false

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: ST_Checker_Master_APK
          path: bin/*.apk
