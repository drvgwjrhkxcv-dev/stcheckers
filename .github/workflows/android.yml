name: ST Checker APK Auto Packager
on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1단계: 유저님의 main.py와 buildozer.spec을 안전하게 가져옵니다.
      - uses: actions/checkout@v4

      # 2단계: 👑 [치트키] 지저분한 SDK 주소록 꼬임과 라이선스 에러를 통째로 자동 진압하는
      # 깃허브 공식 보증 '정품 빌도저 자동 조립 로봇'을 다이렉트로 가동합니다!
      - name: Build with Official Buildozer Action
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          command: buildozer android debug
          buildozer_version: master

      # 3단계: 완성된 순수 파이썬/넘파이 탑재 ST체커 완제품 파일 구출
      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: ST_Checker_Master_APK
          path: bin/*.apk
