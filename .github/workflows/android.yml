name: ST Checker APK Auto Packager
on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies & Pure Aidl
        run: |
          sudo apt-get update --fix-missing || true
          # [해결책 핵심 1] 리눅스 시스템 창고에서 정품 aidl 바이너리를 수동으로 강제 선출시해 받아옵니다.
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake python3-dev build-essential gcc g++ ccache libffi-dev libstdc++6 aidl

      - name: Install Buildozer Tool
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install Cython==0.29.33 buildozer --break-system-packages

      - name: Forced Micro-Infrastructure Creation (The Build-Tools & Aidl Injection)
        run: |
          # [해결책 핵심 2] 빌도저가 없다고 징징대며 찾아 헤매는 마스터 기지 폴더와 build-tools 방을 강제로 임의 건설합니다.
          mkdir -p $HOME/.buildozer/android/platform/android-sdk/build-tools/33.0.0
          
          # [해결책 핵심 3] Search for Aidl 억까를 박살내기 위해, 방금 위에서 apt로 받아둔 리눅스 시스템 정품 'aidl' 복사본을
          # 빌도저가 쳐다볼 그 build-tools/33.0.0 방 안에다가 물리적으로 강제 복사 배달(Injection)해 둡니다!
          cp $(which aidl) $HOME/.buildozer/android/platform/android-sdk/build-tools/33.0.0/aidl
          
          # 빌도저를 속이기 위한 더미 정품 인증 라이선스 폴더까지 선조립 마감
          mkdir -p $HOME/.buildozer/android/platform/android-sdk/licenses
          echo -e "\n24333f1a69b12ffb2a3d6e60af354557b736de2a" > $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          
          # 이제 방 안에 빌도저가 원하는 build-tools와 aidl 파일이 완벽하게 들어차 있는 것을 로그로 똑똑히 증명합니다.
          ls -la $HOME/.buildozer/android/platform/android-sdk/build-tools/33.0.0/

      - name: Build with Buildozer (Forced Offline Packaging)
        env:
          ANDROID_STOREPASS: '"android"'
          ANDROID_KEYPASS: '"android"'
          APP_ANDROID_ACCEPT_SDK_LICENSE: 1
        run: |
          cd ${{ github.workspace }}
          export PATH=$PATH:$HOME/.local/bin
          
          # [마지막 타격] 이미 방 안에 build-tools와 aidl을 강제로 쑤셔 박아놨기 때문에,
          # 오프라인 락(--offline) 상태에서도 빌도저가 딴지 걸지 못하고 입을 다문 채 즉시 안드로이드 완제품 포장을 시작합니다!
          buildozer --offline -v android debug || buildozer -v android debug
        continue-on-error: false

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: ST_Checker_Master_APK
          path: bin/*.apk
