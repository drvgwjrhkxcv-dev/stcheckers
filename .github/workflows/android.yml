name: Build 『ST체커』 Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    # 1. 저장소 코드 체크아웃
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. 파이썬 환경 설정 (Buildozer와 호환성이 가장 좋은 3.10 버전)
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. 우분투 64비트 최신 환경에 맞춘 필수 패키지 설치 (i386 에러 원천 차단)
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev libsqlite3-dev tk-dev uuid-dev lzma-dev liblzma-dev

    # 4. 패키징 도구 설치
    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install buildozer cython==0.29.36 virtualenv

    # 5. Buildozer 빌드 실행 (ST체커 규칙 엔진 및 AI 탑재)
    - name: Build with Buildozer
      run: |
        # 구글 SDK 라이선스 자동 동의 및 빌드 진행
        yes | buildozer android debug

    # 6. 생성된 APK 파일 업로드
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ST-Checker-Game-APK
        path: bin/*.apk
