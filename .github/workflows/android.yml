name: ST Checker APK Auto Packager
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Buildozer Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake python3-dev build-essential gcc g++ ccache libffi-dev

      - name: Install Buildozer & Core Packages
        run: |
          python3 -m pip install --upgrade pip
          # (확인) 발디(bidi)를 완벽하게 제거하고 순수하게 빌도저, 키비, 넘파이,파이횟불만 딱 설치합니다.
          pip install buildozer kivy numpy pytorch

      - name: Build with Buildozer (Safe Auto Mode)
        run: |
          export BUILDOZER_HOME=/tmp/buildozer_cache
          buildozer --accept-sdk-license android debug
        continue-on-error: false

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: ST_Checker_Game_APK
          path: bin/*.apk
