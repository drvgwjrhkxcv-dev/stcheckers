name: Buildozer Auto Packager

on:
  push:
    branches: [ "main" ] # main 브랜치에 푸시될 때 실행 (원하는 브랜치로 변경 가능)
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    # 1. 깃허브 저장소의 코드 가져오기
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. 빌도저 캐시 설정 (빌드 속도 향상)
    - name: Get Date
      id: get-date
      run: |
        echo "date=$(date -u +'%Y%m%d')" >> $GITHUB_OUTPUT

    - name: Cache Buildozer apps
      uses: actions/cache@v4
      with:
        path: .buildozer
        key: ${{ runner.os }}-buildozer-${{ steps.get-date.outputs.date }}
        restore-keys: |
          ${{ runner.os }}-buildozer-

    # 3. 빌도저 필수 의존성 패키지 설치
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential \
          ccache \
          git \
          libffi-dev \
          libssl-dev \
          openjdk-17-jdk \
          python3-pip \
          python3-setuptools \
          python3-venv \
          unzip \
          zip \
          zlib1g-dev

    # 4. 파이썬 및 빌도저 설치
    - name: Install Buildozer and Cython
      run: |
        pip3 install --upgrade pip
        pip3 install buildozer cython numpy torch

    # 5. 빌도저로 안드로이드 APK 빌드
    - name: Build with Buildozer
      run: |
        yes | buildozer -v android debug

    # 6. 빌드된 APK 파일을 깃허브에 업로드 (다운로드 가능하도록)
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: bin/*.apk
