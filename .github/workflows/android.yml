name: ST Checker PyTorch APK Auto Packager
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Buildozer Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake python3-dev build-essential gcc g++ ccache libffi-dev

      - name: Install Pure Build Tools
        run: |
          python3 -m pip install --upgrade pip
          pip install Cython==0.29.33 buildozer

      - name: Build with Buildozer (Absolute Root Path Mode)
        env:
          ANDROID_STOREPASS: '"android"'
          ANDROID_KEYPASS: '"android"'
          APP_ANDROID_ACCEPT_SDK_LICENSE: 1
        run: |
          # [오류 해결 핵심] 깃허브가 파일들을 내려받은 진짜 방(GITHUB_WORKSPACE)으로 
          # 강제로 로그인(cd) 시킨 후 빌도저 포장기를 구동합니다.
          cd $GITHUB_WORKSPACE
          
          # 현재 방에 main.py와 spec 파일이 진짜 잘 있는지 확인 도장 찍기 (디버깅용)
          ls -la
          
          buildozer -v android debug
        continue-on-error: false

      - name: Upload Finished PyTorch APK
        uses: actions/upload-artifact@v4
        with:
          name: ST_Checker_Real_PyTorch_APK
          path: bin/*.apk
